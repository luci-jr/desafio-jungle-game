services:
  postgres:
    image: postgres:16-alpine
    container_name: betting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: betting_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d betting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.7.0
    container_name: betting-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: betting-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: betting-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=betting_db
      - DB_SSLMODE=disable
      - DB_MAX_CONNS=25
      - DB_MIN_CONNS=5
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/wager-transactions.fifo
      - SQS_DLQ_URL=http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      - SQS_EVENT_QUEUE_URL=http://localstack:4566/000000000000/wager-events.fifo
      - AUTH_JWKS_URL=http://keycloak:8080/realms/betting/protocol/openid-connect/certs
      - AUTH_ISSUER=http://keycloak:8080/realms/betting
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  postgres_data:
